# /opt/splunkforwarder/etc/apps/search/local/inputs.conf on the Ubuntu UF Server
# Created by:
#   splunk add monitor /var/log/syslog
#   splunk add monitor /var/log/auth.log
# No index is set, so events go to the default index (main).
# The forwarder runs as splunkfwd, which must be in the adm group to read these files.
[monitor:///var/log/syslog]
disabled = false

[monitor:///var/log/auth.log]
disabled = false
