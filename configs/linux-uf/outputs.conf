# /opt/splunkforwarder/etc/system/local/outputs.conf on the Ubuntu UF Server
# Created by: splunk add forward-server 172.31.40.91:9997
# 172.31.40.91 is the Splunk Server's PRIVATE IP (stays the same across lab restarts).
[tcpout]
defaultGroup = default-autolb-group

[tcpout:default-autolb-group]
server = 172.31.40.91:9997
