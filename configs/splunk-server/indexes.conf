# Index for Windows event logs.
# In the lab this was created in Splunk Web (Settings > Indexes > New Index),
# which stores it under the Search app. This file is the equivalent config.
# It must exist BEFORE the Windows forwarder starts sending, or the indexer drops the events.
[wineventlog]
homePath   = $SPLUNK_DB/wineventlog/db
coldPath   = $SPLUNK_DB/wineventlog/colddb
thawedPath = $SPLUNK_DB/wineventlog/thaweddb
