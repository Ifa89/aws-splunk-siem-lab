# C:\Program Files\SplunkUniversalForwarder\etc\system\local\inputs.conf
# The forwarder service runs as Local System (USE_LOCAL_SYSTEM=1) so it can read the Security log.
# Events go to the wineventlog index, which must already exist on the Splunk Server.

[WinEventLog://Application]
disabled = 0
index = wineventlog

[WinEventLog://System]
disabled = 0
index = wineventlog

[WinEventLog://Security]
disabled = 0
index = wineventlog
